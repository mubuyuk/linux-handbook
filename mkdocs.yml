site_name: Linux Handbook
site_description: Ett personligt uppslagsverk för Linux, kommandon, systemadministration, nätverk, Docker och felsökning

theme:
  name: material
  language: sv
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Ljust tema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Byt till mörkt tema
    # Mörkt tema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Byt till ljust tema

plugins:
  - search:
      lang:
        - sv
        - en

# Navigeringen anges explicit. Lägg till nya kategorier och artiklar här
# i takt med att de skrivs.
nav:
  - Start: index.md
  - Terminal & kommandon:
      - pwd: terminal/pwd.md
      - ls: terminal/ls.md
      - cd: terminal/cd.md
      - mkdir: terminal/mkdir.md
      - cp: terminal/cp.md
      - mv: terminal/mv.md
      - rm: terminal/rm.md
  - Filsystem & rättigheter:
      - chmod: filsystem/chmod.md
      - chown: filsystem/chown.md
      - sudo: filsystem/sudo.md
      - find: filsystem/find.md
      - ln: filsystem/ln.md
  - System & processer:
      - top: system/top.md
      - ps: system/ps.md
      - kill: system/kill.md
      - systemctl: system/systemctl.md
      - journalctl: system/journalctl.md
      - df: system/df.md
      - free: system/free.md
  - Nätverk & felsökning:
      - ip: natverk/ip.md
      - ping: natverk/ping.md
      - curl: natverk/curl.md
      - ss: natverk/ss.md
      - dig: natverk/dig.md
      - traceroute: natverk/traceroute.md
  - Paket & fjärråtkomst:
      - apt: paket-fjarratkomst/apt.md
      - ssh: paket-fjarratkomst/ssh.md
      - scp: paket-fjarratkomst/scp.md
      - tar: paket-fjarratkomst/tar.md
      - grep: paket-fjarratkomst/grep.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
